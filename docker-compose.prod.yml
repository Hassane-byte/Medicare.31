# ─────────────────────────────────────────────────────────────────────────────
# Surcharge pour la production : à utiliser avec le fichier principal.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Ce que ce fichier change :
#   - la base de données n'est plus exposée sur le poste de l'hôte
#   - MailHog (boîte mail de test) est retiré
#   - les journaux sont bornés pour ne pas saturer le disque
#   - chaque service dispose d'un contrôle de santé
# ─────────────────────────────────────────────────────────────────────────────

services:
  nginx:
    ports:
      # HTTP uniquement ici : le certificat TLS est à terminer chez
      # l'hébergeur (Let's Encrypt) ou devant un reverse-proxy externe.
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      ENV: prod
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # Aucun port exposé : la base n'est accessible que depuis le réseau Docker.
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicare_admin} -d ${POSTGRES_DB:-medicaredb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MailHog est un outil de développement : il n'est pas déployé en production.
  mailhog:
    profiles: ["dev"]
