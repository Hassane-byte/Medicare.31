services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    restart: always

  backend:
    build: ./backend
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Pièces jointes de la messagerie et documents déposés
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    expose:
      - "80"
    restart: always

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
    restart: always

  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicare} -d ${POSTGRES_DB:-medicaredb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
