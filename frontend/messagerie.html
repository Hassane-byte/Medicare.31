<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare31 – Messagerie</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/messagerie.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>

  <body>
    <nav>
      <a class="logo" href="index.html" data-dashboard>
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2L4 6v6c0 5.25 3.5 10.14 8 11.35C16.5 22.14 20 17.25 20 12V6l-8-4z"
            />
            <rect x="10" y="7" width="4" height="10" rx="1" />
            <rect x="7" y="10" width="10" height="4" rx="1" />
          </svg>
        </div>
        MediCare31
      </a>

      -->

      <div class="nav-right">
        <button class="notif-btn" type="button">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
        </button>

        <div class="user-chip" data-logout title="Se déconnecter">
          <div class="u-avatar" id="user-nav-avatar">?</div>
          <span id="user-nav-name">Chargement…</span>
        </div>
      </div>
    </nav>

    <div class="app">
      <aside>
        <button class="compose-btn" onclick="openCompose()">
          <svg viewBox="0 0 24 24">
            <path
              d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
            />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
          Nouveau message
        </button>

        <ul class="side-nav">
          <li>
            <a href="index.html"
              ><svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" /></svg
              >Tableau de bord</a
            >
          </li>
          <li>
            <a href="calendrier.html"
              ><svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" /></svg
              >Agenda</a
            >
          </li>
          <li>
            <a href="patients.html"
              ><svg viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" /></svg
              >Patients</a
            >
          </li>
          <li class="active">
            <a href="messagerie.html"
              ><svg viewBox="0 0 24 24">
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                /></svg
              >Messagerie<span class="side-badges">0</span></a
            >
          </li>
          <li>
            <a href="documents.html"
              ><svg viewBox="0 0 24 24">
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />
                <polyline points="14 2 14 8 20 8" /></svg
              >Documents</a
            >
          </li>
        </ul>

        <div class="folder-section">
          <div class="folder-title">Dossiers</div>

          <div class="folder-item active data-folder="inbox" onclick="setFolder(this, 'inbox')">
            <svg viewBox="0 0 24 24">
              <path d="M22 12h-6l-2 3h-4l-2-3H2" />
              <path
                d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
              />
            </svg>
            <span>Boîte de réception</span>
            <span class="folder-count">0</span>
          </div>

          <div class="folder-item data-folder="sent" onclick="setFolder(this, 'sent')">
            <svg viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
            <span>Envoyés</span>
            <span class="folder-count">0</span>
          </div>

          <div class="folder-item data-folder="urgent" onclick="setFolder(this, 'urgent')">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span>Urgents</span>
            <span class="folder-count">0</span>
          </div>

          <div class="folder-item data-folder="archive" onclick="setFolder(this, 'archive')">
            <svg viewBox="0 0 24 24">
              <polyline points="21 8 21 21 3 21 3 8" />
              <rect x="1" y="3" width="22" height="5" />
              <line x1="10" y1="12" x2="14" y2="12" />
            </svg>
            <span>Archivés</span>
            <span class="folder-count">0</span>
          </div>
        </div>
      </aside>

      <div class="messaging">
        <div class="conv-panel">
          <div class="conv-search">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                placeholder="Rechercher une conversation..."
                id="searchInput"
                oninput="filterConvs()"
              />
            </div>
          </div>

          <div class="conv-filter">
            <div class="filter-pill active data-filter="all" onclick="filterPill(this, 'all')">
              Tous
            </div>
            <div class="filter-pill data-filter="unread" onclick="filterPill(this, 'unread')">
              Non lus
            </div>
            <div class="filter-pill data-filter="patients" onclick="filterPill(this, 'patients')">
              Patients
            </div>
            <div class="filter-pill data-filter="equipe" onclick="filterPill(this, 'equipe')">
              Équipe
            </div>
          </div>

          <div class="conv-list" id="convList"></div>
        </div>

        <div class="chat-panel" id="chatPanel">
          <div class="chat-empty" id="chatEmpty">
            <svg viewBox="0 0 24 24">
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              />
            </svg>
            <p>Sélectionnez une conversation</p>
          </div>

          <div
            id="chatActive"
            style="
              display: none;
              flex: 1;
              flex-direction: column;
              overflow: hidden;
            "
          >
            <div class="chat-header" id="chatHeader"></div>
            <div class="chat-body" id="chatBody"></div>

            <div class="chat-footer">
              <div class="reply-banner" id="replyBanner">
                <strong id="replyName"></strong><span id="replyText"></span>
                <button class="reply-close" onclick="closeReply()">×</button>
              </div>

              <div class="compose-area">
                <div class="compose-tools">
                  <button
                    class="compose-tool"
                    title="Joindre un fichier"
                    type="button"
                    onclick="attachFile()"
                  >
                    <svg viewBox="0 0 24 24">
                      <path
                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                      />
                    </svg>
                  </button>
                  <input
                    type="file"
                    id="fileInput"
                    class="hidden"
                    accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.doc,.docx"
                  />
                </div>

                <div class="compose-input-wrap">
                  <div class="pending-file hidden" id="pendingFile"></div>
                  <textarea
                    class="compose-input"
                    id="msgInput"
                    placeholder="Écrire un message…"
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                  ></textarea>
                </div>

                <button class="send-btn" onclick="sendMessage()">
                  <svg viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13" />
                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="info-panel" id="infoPanel">
          <div class="info-header">
            <div class="info-title">Informations</div>
          </div>
          <div class="info-profile" id="infoProfile"></div>
          <div class="info-section" id="infoDetails"></div>
          <div class="info-section" id="infoFiles">
            <div class="info-section-title">Fichiers partagés</div>
            <div class="shared-files" id="sharedFilesList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="composeModal" onclick="closeCompose(event)">
      <div class="modal-compose-wrapper" onclick="event.stopPropagation()">
        <div class="modal">
          <div class="modal-header">
            <div class="modal-title">
              <svg viewBox="0 0 24 24">
                <path
                  d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                />
                <path
                  d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                />
              </svg>
              Nouveau message
            </div>
            <button
              class="modal-close"
              onclick="
                document.getElementById('composeModal').classList.remove('open')
              "
            >
              ×
            </button>
          </div>

          <div class="modal-body">
            <div class="modal-field">
              <label>Destinataire</label>
              <input
                type="text"
                id="cTo"
                placeholder="Sélectionnez un contact dans la liste →"
                oninput="onComposeToClear()"
              />
            </div>

            <div class="modal-field">
              <label>Objet</label>
              <input type="text" id="cSubject" placeholder="Objet du message" />
            </div>

            <div class="modal-field">
              <label>Message</label>
              <textarea
                id="cBody"
                placeholder="Rédigez votre message ici…"
              ></textarea>
            </div>

            <div class="modal-field">
              <label>Priorité</label>
              <select id="cPriority">
                <option value="normal">Normale</option>
                <option value="urgent">Urgente</option>
                <option value="low">Faible</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <div></div>
            <div style="display: flex; gap: 10px">
              <button
                class="btn-cancel"
                onclick="
                  document
                    .getElementById('composeModal')
                    .classList.remove('open')
                "
              >
                Annuler
              </button>
              <button class="btn-send" onclick="sendComposed()">
                <svg viewBox="0 0 24 24">
                  <line x1="22" y1="2" x2="11" y2="13" />
                  <polygon points="22 2 15 22 11 13 2 9 22 2" />
                </svg>
                Envoyer
              </button>
            </div>
          </div>
        </div>

        <div class="contact-panel">
          <div class="contact-panel-header">
            <svg viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Contacts
          </div>
          <div class="contact-search-wrap">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="contactSearch"
              placeholder="Rechercher..."
              oninput="filterContactList()"
            />
          </div>
          <div class="contact-list" id="contactList"></div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
      <span id="toastMsg">Message envoyé</span>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/roles.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>

    <script src="js/messagerie-api.js"></script>
    <script>
      authGuard();
    </script>
  </body>
</html>
