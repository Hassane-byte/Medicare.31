<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare31 – Agenda</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="css/calendrier.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <!-- NAV -->
    <nav>
      <a class="logo" href="index.html">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2L4 6v6c0 5.25 3.5 10.14 8 11.35C16.5 22.14 20 17.25 20 12V6l-8-4z"
            />
            <rect x="10" y="7" width="4" height="10" rx="1" />
            <rect x="7" y="10" width="10" height="4" rx="1" />
          </svg>
        </div>
        MediCare31
      </a>

      <div class="nav-right">
        <button class="notif-btn" type="button">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg
          >
        </button>
        <div class="user-chip" data-logout title="Se déconnecter">
          <div class="avatar" id="user-nav-avatar">?</div>
          <span id="user-nav-name">Chargement…</span>
          <svg class="chev" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </div>
      </div>
    </nav>

    <!-- APP -->
    <div class="app">
      <!-- SIDEBAR -->
      <aside>
        <ul class="side-nav">
          <li>
            <a href="index.html" data-dashboard
              ><svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" /></svg
              >Tableau de bord</a
            >
          </li>
          <li class="active">
            <a href="calendrier.html"
              ><svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" /></svg
              >Agenda</a
            >
          </li>
          <li>
            <a href="patients.html" data-staff-only
              ><svg viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" /></svg
              >Patients</a
            >
          </li>
          <li>
            <a href="messagerie.html"
              ><svg viewBox="0 0 24 24">
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                /></svg
              >Messagerie</a
            >
          </li>
          <li>
            <a href="documents.html"
              ><svg viewBox="0 0 24 24">
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />
                <polyline points="14 2 14 8 20 8" /></svg
              >Documents</a
            >
          </li>
          <li>
            <a href="statistiques.html" data-staff-only
              ><svg viewBox="0 0 24 24">
                <line x1="18" y1="20" x2="18" y2="10" />
                <line x1="12" y1="20" x2="12" y2="4" />
                <line x1="6" y1="20" x2="6" y2="14" /></svg
              >Statistiques</a
            >
          </li>
        </ul>

        <!-- MINI CALENDAR -->
        <div class="mini-cal">
          <div class="mini-cal-header">
            <button class="mini-nav" id="miniPrev" onclick="miniNav(-1)">
              <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>
            <span id="miniMonth">juin 2025</span>
            <button class="mini-nav" id="miniNext" onclick="miniNav(1)">
              <svg viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
          </div>
          <div class="mini-grid" id="miniGrid"></div>
        </div>

        <!-- DOCTOR FILTER -->
        <div class="doctor-filter">
          <div class="filter-title">Praticiens</div>
          <div id="doctorList"></div>
        </div>
      </aside>

      <!-- MAIN -->
      <main>
        <!-- TOOLBAR -->
        <div class="toolbar">
          <div class="toolbar-left">
            <button class="nav-btn" onclick="navigate(-1)">
              <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>
            <button class="nav-btn" onclick="navigate(1)">
              <svg viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
            <button class="today-btn" onclick="goToday()">Aujourd'hui</button>
            <div class="current-period" id="currentPeriod">—</div>
          </div>
          <div class="toolbar-right">
            <div class="view-switch">
              <button class="view-btn" onclick="setView('day')" id="vDay">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <line x1="3" y1="10" x2="21" y2="10" /></svg
                >Jour
              </button>
              <button
                class="view-btn active"
                onclick="setView('week')"
                id="vWeek"
              >
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <line x1="9" y1="4" x2="9" y2="22" />
                  <line x1="15" y1="4" x2="15" y2="22" />
                  <line x1="3" y1="10" x2="21" y2="10" /></svg
                >Semaine
              </button>
              <button class="view-btn" onclick="setView('month')" id="vMonth">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" /></svg
                >Mois
              </button>
            </div>
            <button class="btn-add-appt" id="btnAddAppt" onclick="openModal()">
              <svg viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Nouveau rendez-vous
            </button>
          </div>
        </div>

        <!-- CALENDAR CONTAINER -->
        <div class="cal-container">
          <!-- WEEK VIEW -->
          <div class="week-view active" id="weekView">
            <div class="week-header" id="weekHeader"></div>
            <div class="week-body" id="weekBody"></div>
          </div>
          <!-- MONTH VIEW -->
          <div class="month-view" id="monthView">
            <div class="month-grid-header">
              <div>Lun</div>
              <div>Mar</div>
              <div>Mer</div>
              <div>Jeu</div>
              <div>Ven</div>
              <div>Sam</div>
              <div>Dim</div>
            </div>
            <div class="month-grid" id="monthGrid"></div>
          </div>
          <!-- DAY VIEW -->
          <div class="day-view" id="dayView">
            <div
              class="week-header"
              id="dayHeader"
              style="grid-template-columns: 60px 1fr"
            ></div>
            <div
              class="week-body"
              id="dayBody"
              style="grid-template-columns: 60px 1fr"
            ></div>
          </div>
        </div>
      </main>
    </div>

    <!-- ═══ ADD/EDIT MODAL ═══ -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span id="modalTitleText">Nouveau rendez-vous</span>
          </div>
          <button class="modal-close" onclick="closeModalBtn()">
            <svg viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <div class="fg">
              <label for="mPatient">Patient <span class="req">*</span></label>
              <div class="inp-wrap">
                <svg viewBox="0 0 24 24">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <input
                  type="text"
                  id="mPatient"
                  placeholder="Nom du patient"
                  list="patientList"
                />
                <datalist id="patientList"></datalist>
              </div>
            </div>
            <div class="fg">
              <label for="mDoctor">Médecin <span class="req">*</span></label>
              <div class="inp-wrap">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                  />
                </svg>
                <select id="mDoctor">
                  <option value="">-- Choisir --</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="fg">
              <label for="mType"
                >Type de consultation <span class="req">*</span></label
              >
              <div class="inp-wrap">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10" />
                  <line x1="12" y1="8" x2="12" y2="12" />
                  <circle cx="12" cy="16" r=".5" fill="currentColor" />
                </svg>
                <select id="mType">
                  <option value="">-- Type --</option>
                </select>
              </div>
            </div>
            <div class="fg">
              <label for="mStatus">Statut</label>
              <div class="status-row" id="statusRow">
                <div
                  class="status-opt sel"
                  onclick="selectStatus(this, 'Confirmé')"
                >
                  Confirmé
                </div>
                <div
                  class="status-opt"
                  onclick="selectStatus(this, 'En attente')"
                >
                  En attente
                </div>
                <div class="status-opt" onclick="selectStatus(this, 'Annulé')">
                  Annulé
                </div>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="fg">
              <label for="mDate">Date <span class="req">*</span></label>
              <div class="inp-wrap">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
                <input type="date" id="mDate" />
              </div>
            </div>
            <div class="fg">
              <label>Horaire <span class="req">*</span></label>
              <div style="display: flex; gap: 8px">
                <div class="inp-wrap" style="flex: 1">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                  </svg>
                  <input type="time" id="mStart" value="09:00" />
                </div>
                <div class="inp-wrap" style="flex: 1">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                  </svg>
                  <input type="time" id="mEnd" value="09:30" />
                </div>
              </div>
            </div>
          </div>

          <div class="form-row full">
            <div class="fg">
              <label for="mRoom">Salle / Cabinet</label>
              <div class="inp-wrap">
                <svg viewBox="0 0 24 24">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <input
                  type="text"
                  id="mRoom"
                  placeholder="Cabinet 1, Salle B..."
                  list="roomList"
                />
                <datalist id="roomList"></datalist>
              </div>
            </div>
          </div>

          <div class="form-row full">
            <div class="fg">
              <label for="mNotes">Notes / Motif</label>
              <textarea
                class="inp"
                id="mNotes"
                placeholder="Informations complémentaires, motif de consultation..."
              ></textarea>
            </div>
          </div>

          <div class="form-row full">
            <div class="fg">
              <label>Couleur</label>
              <div class="color-row" id="colorPicker">
                <div
                  class="color-dot selected"
                  style="background: #3b82f6"
                  data-color="blue"
                  onclick="pickColor(this)"
                >
                  <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </div>
                <div
                  class="color-dot"
                  style="background: #10b981"
                  data-color="green"
                  onclick="pickColor(this)"
                >
                  <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </div>
                <div
                  class="color-dot"
                  style="background: #8b5cf6"
                  data-color="purple"
                  onclick="pickColor(this)"
                >
                  <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </div>
                <div
                  class="color-dot"
                  style="background: #f59e0b"
                  data-color="orange"
                  onclick="pickColor(this)"
                >
                  <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </div>
                <div
                  class="color-dot"
                  style="background: #ef4444"
                  data-color="red"
                  onclick="pickColor(this)"
                >
                  <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </div>
                <div
                  class="color-dot"
                  style="background: #14b8a6"
                  data-color="teal"
                  onclick="pickColor(this)"
                >
                  <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn-delete"
            id="btnDelete"
            onclick="deleteAppt()"
            style="display: none"
          >
            <svg viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
            </svg>
            Supprimer
          </button>
          <div style="display: flex; gap: 10px; margin-left: auto">
            <button class="btn-cancel" onclick="closeModalBtn()">
              Annuler
            </button>
            <button class="btn-save" onclick="saveAppt()">
              <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" />
              </svg>
              Enregistrer
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- DETAIL POPUP -->
    <div class="detail-popup" id="detailPopup">
      <div class="detail-popup-header">
        <div>
          <div class="detail-popup-title" id="dp-title">—</div>
          <div class="detail-popup-time" id="dp-time">—</div>
        </div>
        <div class="detail-badge" id="dp-badge">—</div>
      </div>
      <div class="detail-info">
        <div class="detail-row">
          <svg viewBox="0 0 24 24">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
            /></svg
          ><span id="dp-doctor">—</span>
        </div>
        <div class="detail-row">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" /></svg
          ><span id="dp-type">—</span>
        </div>
        <div class="detail-row" id="dp-notes-row" style="display: none">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" /></svg
          ><span id="dp-notes">—</span>
        </div>
      </div>
      <div class="detail-actions">
        <button class="detail-btn edit" id="dp-edit">
          <svg viewBox="0 0 24 24">
            <path
              d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
            />
            <path
              d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
            /></svg
          >Modifier
        </button>
        <button class="detail-btn del" id="dp-del">
          <svg viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14H6L5 6" /></svg
          >Supprimer
        </button>
        <button
          class="detail-btn"
          style="background: var(--bg); color: var(--text-mid)"
          onclick="closeDetail()"
        >
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" /></svg
          >Fermer
        </button>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
      <span id="toastMsg">Rendez-vous enregistré</span>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/roles.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="js/calendrier.js"></script>
  </body>
</html>
