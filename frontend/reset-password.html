<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare31 – Nouveau mot de passe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/legal.css" />
  </head>
  <body class="centered">
    <main class="card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L4 6v6c0 5.25 3.5 10.14 8 11.35C16.5 22.14 20 17.25 20 12V6l-8-4z" />
            <rect x="10" y="7" width="4" height="10" rx="1" />
            <rect x="7" y="10" width="10" height="4" rx="1" />
          </svg>
        </div>
        MediCare31
      </div>

      <h1>Définir un nouveau mot de passe</h1>
      <p class="lead" id="lead">
        Choisissez un nouveau mot de passe d'au moins 8 caractères.
      </p>

      <form id="resetForm" onsubmit="handleReset(event)" novalidate>
        <label for="pwd">Nouveau mot de passe</label>
        <input type="password" id="pwd" autocomplete="new-password" required />

        <label for="pwd2">Confirmer le mot de passe</label>
        <input type="password" id="pwd2" autocomplete="new-password" required />

        <div class="meter" id="meter"><span id="meterFill"></span></div>
        <p class="strength" id="strengthLabel">Entrez un mot de passe</p>

        <div class="feedback" id="feedback"></div>

        <button type="submit" class="btn-primary">Mettre à jour le mot de passe</button>
      </form>

      <p class="back"><a href="login.html">← Retour à la connexion</a></p>
    </main>

    <script src="/js/reset-password.js"></script>
  </body>
</html>
