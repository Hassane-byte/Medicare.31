<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare31 – Documents</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #0f766e;
        --primary-light: #14b8a6;
        --text: #0f172a;
        --text-light: #64748b;
        --bg: #f1f5f9;
        --card: #ffffff;
        --border: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Source Sans 3", system-ui, sans-serif;
      }
      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        height: 64px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Nunito", sans-serif;
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--primary);
        text-decoration: none;
      }
      .nav-links { display: flex; gap: 6px; }
      .nav-links a {
        padding: 8px 14px;
        border-radius: 8px;
        color: var(--text-light);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .nav-links a:hover { background: var(--bg); color: var(--text); }
      .nav-links a.active { background: #ccfbf1; color: var(--primary); }
      main {
        max-width: 760px;
        margin: 64px auto;
        padding: 0 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 48px 32px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #ccfbf1;
        display: grid;
        place-items: center;
        color: var(--primary);
      }
      .icon svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 2; }
      h1 { font-family: "Nunito", sans-serif; font-size: 1.5rem; margin: 0 0 12px; }
      p { color: var(--text-light); margin: 0 auto; max-width: 460px; line-height: 1.6; }
      .badge {
        display: inline-block;
        margin-top: 24px;
        padding: 6px 14px;
        border-radius: 999px;
        background: #fef3c7;
        color: #92400e;
        font-weight: 700;
        font-size: 0.78rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <nav>
      <a class="logo" href="index.html">MediCare31</a>
      <div class="nav-links">
        <a href="index.html">Tableau de bord</a>
        <a href="calendrier.html">Agenda</a>
        <a href="patients.html">Patients</a>
        <a href="messagerie.html">Messagerie</a>
        <a href="documents.html" class="active">Documents</a>
      </div>
    </nav>

    <main>
      <div class="card">
        <div class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
        </div>
        <h1>Gestion documentaire</h1>
        <p>
          Ce module est en cours de développement. Il permettra de centraliser
          les comptes rendus, ordonnances et pièces administratives des patients.
        </p>
        <span class="badge">Bientôt disponible</span>
      </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
      authGuard();
    </script>
  </body>
</html>
